github_org: foundingGIDE
git_main_branch: master
id: fbbi
documentation:
  documentation_system: mkdocs
namespaces:
  - http://purl.obolibrary.org/obo/FBbi_
robot_plugins:
  plugins:
    - name: odk
      mirror_from: https://github.com/INCATools/odk-robot-plugin/releases/download/odk-robot-plugin-0.3.3/odk.jar
import_group:
  use_base_merging: true
  slme_individuals: exclude
  products:
  - id: ro
  - id: omo
  - id: iao
components:
  products:
  - filename: orcidio.owl
robot:
  reasoner: ELK
repo: fbbi
report_fail_on: ERROR
title: Biological imaging methods ontology
uribase: http://purl.obolibrary.org/obo
workflows:
  - qc
use_mappings: true
sssom_mappingset_group:
  release_mappings: true
  products:
    - id: main
      maintenance: manual
